[package]
name = "strymek"
version = "0.3.0"
edition = "2021"
description = "Stream individual Linux applications to a browser, one URL per app"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
if-addrs = "0.13"
libc = "0.2"
png = "0.17"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webp = { version = "0.3", default-features = false }
x11rb = { version = "0.13", features = ["damage", "xfixes", "xtest", "randr", "shm", "allow-unsafe-code"] }
futures-util = "0.3"
rpassword = "7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
